plugins {
    id 'java'
}

group = 'com.redwood.scheduler.custom.snowflake'
version = '1.0.1'

repositories {
    mavenCentral()

    // Shared Redwood library folder
    flatDir {
        dirs "C:/Users/z004y4es/IdeaProjects/2025.2.0.6-2026-03-06-1610_gd3daddfbcbb"
    }
}

dependencies {

    compileOnly "com.fasterxml.jackson.core:jackson-core:2.18.3"
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:2.18.3"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:2.18.3"

    compileOnly 'com.nimbusds:nimbus-jose-jwt:10.5'

    compileOnly 'org.bouncycastle:bcprov-jdk18on:1.81'
    compileOnly 'org.bouncycastle:bcpkix-jdk18on:1.81'


    // Load all jars in the shared RW directory
    implementation name: 'api-public'
    implementation name: 'api-signed'
    implementation name: 'api-tool-lib'
    implementation name: 'configuration-api'
    implementation name: 'configuration-signed'
    implementation name: 'infrastructure-public'
    implementation name: 'infrastructure-signed'
    implementation name: 'rfcapi-cm-public'
    implementation name: 'rfcapi-public'

    // Optional: if `valet` contains jars
    implementation fileTree(dir: "C:/Users/z004y4es/IdeaProjects/2025.2.0.6-2026-03-06-1610_gd3daddfbcbb/valet", include: ["*.jar"])

    implementation 'org.apache.commons:commons-csv:1.10.0'
}